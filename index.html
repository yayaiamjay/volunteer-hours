<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>臺南市歷史館｜志工值勤時數查詢</title>
<style>
:root {
  color-scheme: light dark;
  --site-primary:#23576B;
  --site-on-primary:#FFFFFF;
  --site-secondary:#E6F1F1;
  --site-on-secondary:#24424D;
  --site-background:#F5F7F7;
  --site-on-background:#20353E;
  --site-font-body:system-ui,"Noto Sans TC",sans-serif;
  --site-font-heading:system-ui,"Noto Sans TC",sans-serif;
  --site-heading-scale:1;
  --site-spacing-scale:1;
  --site-radius-scale:1;
  --site-decoration-opacity:1;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--site-font-body)}
#app{min-height:100vh;background-color:light-dark(var(--site-background),#15252C);color:light-dark(var(--site-on-background),#EAF1F3);border-radius:0;padding:calc(42px * var(--site-spacing-scale)) 20px 64px}
main{max-width:760px;margin:auto}
.eyebrow{font-size:13px;letter-spacing:.12em;font-weight:700;color:light-dark(#527987,#A9C5CF)}
h1{font-family:var(--site-font-heading);font-size:calc(31px * var(--site-heading-scale));margin:12px 0 8px;line-height:1.35}
.intro{line-height:1.8;color:light-dark(#60737A,#B8C7CC);margin:0 0 30px}
.panel{background:light-dark(#FFFFFF,#21343C);border:1px solid light-dark(#DDE6E8,#38505B);border-radius:calc(16px * var(--site-radius-scale));padding:calc(26px * var(--site-spacing-scale));box-shadow:0 8px 24px #152F3710}
label{display:block;font-weight:700;margin-bottom:12px}
.form{display:flex;gap:10px}
input{min-width:0;flex:1;padding:14px 15px;font:inherit;border:1px solid light-dark(#C4D3D8,#68808A);border-radius:calc(9px * var(--site-radius-scale));background:light-dark(#FFFFFF,#182A32);color:inherit;outline-offset:3px}
button{border:0;background:var(--site-primary);color:var(--site-on-primary);font:inherit;font-weight:700;border-radius:calc(9px * var(--site-radius-scale));padding:12px 25px;cursor:pointer}
button:hover{filter:brightness(1.12)}
.hint{font-size:13px;color:light-dark(#708087,#B8C7CC);margin:13px 0 0}
#result{margin-top:22px}
.result-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:19px}
.result-head h2{font-size:calc(22px * var(--site-heading-scale));margin:0}
.year{font-size:13px;color:light-dark(#708087,#B8C7CC)}
table{width:100%;border-collapse:collapse;text-align:center}
th{font-size:13px;font-weight:700;background:light-dark(var(--site-secondary),#304C58);color:light-dark(var(--site-on-secondary),#EAF4F5)}
th,td{padding:15px 8px;border-bottom:1px solid light-dark(#E1E9EB,#3D5660)}
td{font-size:18px;font-variant-numeric:tabular-nums}
.total{margin-top:20px;border-radius:calc(12px * var(--site-radius-scale));padding:19px 22px;background:var(--site-primary);color:var(--site-on-primary);display:flex;align-items:center;justify-content:space-between;gap:12px}
.total strong{font-size:28px}
.error{color:light-dark(#A53C37,#FFB4AB);font-weight:600}
footer{font-size:12px;color:light-dark(#819095,#A9BDC5);text-align:center;margin-top:35px;line-height:1.8}
@media(max-width:520px){#app{padding:30px 15px 50px}h1{font-size:calc(25px * var(--site-heading-scale))}.panel{padding:18px}.form{flex-direction:column}button{width:100%}th,td{padding:13px 3px}th{font-size:11px}td{font-size:15px}}
</style>
</head>
<body>
<div id="app">
<main>
<div class="eyebrow">TAINAN CITY MUSEUM · VOLUNTEER SERVICE</div>
<h1>臺南市歷史館<br>志工值勤時數查詢</h1>
<p class="intro">輸入您的姓名，即可查詢民國115年度各季值勤時數與全年累計時數。</p>
<section class="panel">
<label for="name">志工姓名</label>
<form class="form" id="searchForm">
<input id="name" type="text" autocomplete="off" placeholder="請輸入完整姓名" required>
<button type="submit">查詢時數</button>
</form>
<p class="hint">請輸入登記於志工名冊上的完整姓名。資料依館方線上試算表最新登錄內容顯示。</p>
<div id="result" aria-live="polite" hidden></div>
</section>
<footer>臺南市歷史館 · 115年度志工值勤時數<br>本頁查詢資料由館方線上時數表提供。</footer>
</main>
</div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx2p16q5Si3kQu2gHyPl4-ekDm0puGZDR2n5fjlu7ImYzm5J8rNIdCiu54NJmFBAa9D4Q/exec';
const form = document.getElementById('searchForm');
const input = document.getElementById('name');
const result = document.getElementById('result');
const submitButton = form.querySelector('button');
let requestNumber = 0;
function fmt(v) { return Number(v).toLocaleString('zh-TW', { maximumFractionDigits: 2 }); }
function showMessage(message) {
  result.replaceChildren();
  const p = document.createElement('p');
  p.className = 'error';
  p.textContent = message;
  result.appendChild(p);
}
function showHours(data) {
  result.replaceChildren();
  const section = document.createElement('section');
  const head = document.createElement('div');
  head.className = 'result-head';
  const h = document.createElement('h2');
  h.textContent = data.name + ' 的值勤紀錄';
  const year = document.createElement('span');
  year.className = 'year';
  year.textContent = '民國115年度';
  head.append(h, year);
  const table = document.createElement('table');
  const trh = document.createElement('tr');
  ['1~3月','4~6月','7~9月','10~12月'].forEach(label => {
    const th = document.createElement('th');
    th.scope = 'col';
    th.textContent = label;
    trh.appendChild(th);
  });
  const tr = document.createElement('tr');
  [data.quarters.q1,data.quarters.q2,data.quarters.q3,data.quarters.q4].forEach(value => {
    const td = document.createElement('td');
    td.textContent = fmt(value);
    tr.appendChild(td);
  });
  const thead = document.createElement('thead');
  thead.appendChild(trh);
  const tbody = document.createElement('tbody');
  tbody.appendChild(tr);
  table.append(thead, tbody);
  const total = document.createElement('div');
  total.className = 'total';
  const title = document.createElement('span');
  title.textContent = 'TOTAL · 累計總時數';
  const amount = document.createElement('strong');
  amount.textContent = fmt(data.total) + ' 小時';
  total.append(title, amount);
  section.append(head, table, total);
  result.appendChild(section);
}
form.addEventListener('submit', event => {
  event.preventDefault();
  const name = input.value.trim();
  if (!name) return;
  const current = ++requestNumber;
  result.hidden = false;
  result.replaceChildren();
  const loading = document.createElement('p');
  loading.textContent = '正在讀取最新時數，請稍候…';
  result.appendChild(loading);
  submitButton.disabled = true;
  const callbackName = 'volunteerCallback_' + current + '_' + Date.now();
  const script = document.createElement('script');
  let finished = false;
  let timeoutId;
  function cleanup() {
    if (finished) return false;
    finished = true;
    clearTimeout(timeoutId);
    script.remove();
    // Keep a harmless callback temporarily for any delayed response.
    window[callbackName] = function() {};
    setTimeout(() => { delete window[callbackName]; }, 60000);
    if (current === requestNumber) submitButton.disabled = false;
    return true;
  }
  window[callbackName] = data => {
    if (!cleanup() || current !== requestNumber) return;
    if (!data || !data.success) {
      showMessage((data && data.message) || '查詢失敗，請稍後再試。');
      return;
    }
    showHours(data);
  };
  script.onerror = () => {
    if (!cleanup() || current !== requestNumber) return;
    showMessage('目前無法連接線上時數表，請稍後再試，或聯繫館方。');
  };
  timeoutId = setTimeout(() => {
    if (!cleanup() || current !== requestNumber) return;
    showMessage('查詢逾時，請稍後重試。');
  }, 15000);
  const params = new URLSearchParams({ name, callback: callbackName, _: String(Date.now()) });
  script.src = API_URL + '?' + params.toString();
  document.head.appendChild(script);
});
</script>
</body>
</html>
